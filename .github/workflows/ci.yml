name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend + shared (.NET, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore KingshotTools.Backend.slnf
      - run: dotnet build KingshotTools.Backend.slnf -c Release --no-restore
      - run: dotnet test --solution KingshotTools.Backend.slnf -c Release --no-build

  agent:
    name: Agent (.NET, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore KingshotTools.Agent.slnf
      # Debug: the dev console build, which includes the decoder.
      - run: dotnet build KingshotTools.Agent.slnf -c Debug --no-restore
      - run: dotnet test --solution KingshotTools.Agent.slnf -c Debug --no-build
      - name: Release agent has no decoder
        shell: pwsh
        run: ./tools/verify-release-agent.ps1

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
